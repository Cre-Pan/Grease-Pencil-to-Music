# Publishes docs/ (the site and the built web app) to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
#
# Two jobs, as in GitHub's own Pages starter: the artifact is uploaded in "build" and
# fetched in "deploy". With a single job, deploy-pages sometimes asked for the artifact
# before GitHub had indexed it ("No artifacts named github-pages were found") and the run
# failed although nothing was wrong with the site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a deploy already under way is finished, not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
