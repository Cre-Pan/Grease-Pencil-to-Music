# Builds the iPad app (ios/) on a macOS runner and uploads an unsigned .ipa as an artifact.
# Install it with Sideloadly (Windows/Mac) or SideStore, signing it with your own Apple ID.
name: iPad app

on:
  push:
    branches: [main]
    paths: ["ios/**", "docs/app/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "docs/app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project DoodleMusic.xcodeproj -scheme DoodleMusic -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DoodleMusic.app Payload/
          zip -qry DoodleMusic.ipa Payload
          ls -lh DoodleMusic.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DoodleMusic-ipa
          path: ios/DoodleMusic.ipa
      - name: Publish as the "iPad app" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ipad-app >/dev/null 2>&1 || gh release create ipad-app --title "App iPad" --notes "L'ultima build dell'app iPad. Scarica DoodleMusic.ipa e installala con Sideloadly o SideStore." --latest=false
          gh release upload ipad-app ios/DoodleMusic.ipa --clobber
